name: ci

# Product pipeline with quality gates (US-P1-PLT-03, llm_guidelines.md §9).
# Required checks on main: ci / tooling, ci / backend, ci / architecture, ci / frontend,
# ci / local-stack, ci / security, docs.
# Tenant-isolation and OpenAPI-diff jobs are added with the first API (P1.5); nothing here is a placeholder.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  tooling:
    # Fast checks first: workflow lint and the tests of our own CI tools.
    name: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/ci/install-tool.sh actionlint
      - name: Lint workflows
        run: ~/.local/bin/actionlint
      - name: CI tool tests (TC-P1-PLT-005 coverage gate)
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore Karry.slnx --locked-mode
      - name: Format (whitespace, style, analyzers)
        run: dotnet format Karry.slnx --no-restore --verify-no-changes
      - run: dotnet build Karry.slnx -c Release --no-restore
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - name: Test with coverage
        run: >-
          dotnet test --solution Karry.slnx -c Release --no-build
          --report-xunit-trx --coverage --coverage-output-format cobertura
          --results-directory ${{ github.workspace }}/TestResults
      - name: Coverage gate (Domain >= 80 %)
        run: python3 tools/ci/coverage_gate.py --summary "$GITHUB_STEP_SUMMARY" TestResults/*.cobertura.xml
      - name: Coverage report (all assemblies, informational)
        if: always()
        run: python3 tools/ci/coverage_gate.py --pattern '^Karry\.' --threshold 0 --summary "$GITHUB_STEP_SUMMARY" TestResults/*.cobertura.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-results
          path: TestResults/

  architecture:
    name: architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore Karry.slnx --locked-mode
      - run: dotnet build tests/Karry.ArchitectureTests -c Release --no-restore
      - name: Architecture rules (TC-P1-PLT-001, TC-P1-PLT-014)
        run: dotnet test --project tests/Karry.ArchitectureTests -c Release --no-build
      - name: Module template (TC-P1-PLT-003)
        run: tools/templates/test-template.sh

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      # Also enforces the supply-chain policy in pnpm-workspace.yaml (release age, trust, sources).
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test (TC-P1-PLT-015)
        run: pnpm test
      - run: pnpm build

  local-stack:
    name: local-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore src/backend/Karry.Host --locked-mode
      # TC-P1-PLT-004: all services healthy, extensions, roles, Keycloak, Mailpit, Valkey,
      # S3 Object Lock (compliance) and Karry.Host readiness against the stack.
      - name: Local stack smoke test (TC-P1-PLT-004)
        run: deploy/docker/smoke-test.sh

  security:
    # Free, licence-compatible scanners for a private commercial repository (ADR-0021).
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - run: tools/ci/install-tool.sh gitleaks && tools/ci/install-tool.sh trivy
      - name: Secrets in history (gitleaks, TC-P1-PLT-002)
        run: ~/.local/bin/gitleaks git --redact --no-banner --exit-code 1 .
      - name: Vulnerable dependencies and misconfigurations (Trivy)
        run: >-
          ~/.local/bin/trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 --skip-dirs spikes .
      - name: Static analysis (Semgrep CE 1.180.0, pinned by digest)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
          semgrep scan --metrics=off --error
          --config p/csharp --config p/typescript --config p/react --config p/owasp-top-ten
          --config p/dockerfile --config p/python

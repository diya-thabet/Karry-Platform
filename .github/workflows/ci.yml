name: ci

# Product pipeline with quality gates (US-P1-PLT-03, llm_guidelines.md §9).
# Required checks (tools/ci/merge_guard.py): tooling, backend, architecture, frontend, local-stack, security,
# tenant-isolation, authorization, openapi-diff, docs (links and anchors).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  tooling:
    # Fast checks first: workflow lint, the tests of our own CI tools, observability as code.
    name: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/ci/install-tool.sh actionlint
      - name: Lint workflows
        run: ~/.local/bin/actionlint
      - name: CI tool tests (TC-P1-PLT-005 coverage gate)
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: N'Ko catalog draft generator tests
        run: python3 -m unittest discover -s tools/i18n -p 'test_*.py' -v
      - name: ZAP findings judge tests (hardening plan H-W1)
        run: python3 -m unittest discover -s tests/security -p 'test_*.py' -v
      - name: Dashboards as code are up to date
        run: python3 deploy/observability/dashboards/generate.py --check
      - name: Keycloak realm as code is up to date
        run: python3 deploy/keycloak/generate_realm.py --check
      # promtool from the same grafana/otel-lgtm image as deploy/docker/compose.yaml (0.37.0, Prometheus 3.15.0),
      # pinned by digest: the rules are tested by the Prometheus version that evaluates them. Upgrade both together.
      - name: Alert rules and Prometheus config (TC-P1-OPS-006)
        run: |
          promtool() {
            docker run --rm -v "$PWD/deploy/observability:/w:ro" -v "$PWD/deploy/observability/alerts:/etc/karry/alerts:ro" -w /w \
              --entrypoint /otel-lgtm/prometheus/promtool \
              grafana/otel-lgtm@sha256:57b5ab1ca6619beb180174e2fccce04762470750669d043f544b4726d0582d07 "$@"
          }
          promtool check config prometheus.yaml
          promtool test rules alerts/karry-alerts.test.yaml

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore Karry.slnx --locked-mode
      - name: Format (whitespace, style, analyzers)
        run: dotnet format Karry.slnx --no-restore --verify-no-changes
      - run: dotnet build Karry.slnx -c Release --no-restore
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - name: Test with coverage
        run: >-
          dotnet test --solution Karry.slnx -c Release --no-build
          --report-xunit-trx --coverage --coverage-output-format cobertura
          --results-directory ${{ github.workspace }}/TestResults
      - name: API contract is committed (src/backend/Karry.Host/openapi/v1.json regenerated by the build)
        run: git diff --exit-code -- src/backend/Karry.Host/openapi
      - name: Coverage gate (Domain >= 80 %)
        run: python3 tools/ci/coverage_gate.py --solution Karry.slnx --summary "$GITHUB_STEP_SUMMARY" TestResults/*.cobertura.xml
      - name: Coverage report (all assemblies, informational)
        if: always() && hashFiles('TestResults/*.cobertura.xml') != ''
        run: python3 tools/ci/coverage_gate.py --pattern '^Karry\.' --threshold 0 --summary "$GITHUB_STEP_SUMMARY" TestResults/*.cobertura.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-results
          path: TestResults/

  architecture:
    name: architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore Karry.slnx --locked-mode
      - run: dotnet build tests/Karry.ArchitectureTests -c Release --no-restore
      - name: Architecture rules (TC-P1-PLT-001, TC-P1-PLT-014)
        run: dotnet test --project tests/Karry.ArchitectureTests -c Release --no-build
      - name: Module template (TC-P1-PLT-003)
        run: tools/templates/test-template.sh

  tenant-isolation:
    # US-P1-TEN-03: every API operation attacked with another tenant's token; a failure blocks the merge.
    name: tenant-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore Karry.slnx --locked-mode
      - run: dotnet build tests/Karry.TenantIsolationTests -c Release --no-restore
      - name: Tenant isolation suite (TC-P1-TEN-002)
        run: dotnet test --project tests/Karry.TenantIsolationTests -c Release --no-build

  authorization:
    # US-P1-IAM-05..07: every endpoint's permission decision, the masking suite (TC-P1-IAM-005) and the scope and
    # role-matrix tests (TC-P1-IAM-006) on PostgreSQL and Keycloak; a failure blocks the merge.
    name: authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore Karry.slnx --locked-mode
      - run: dotnet build tests/Karry.AuthorizationTests -c Release --no-restore
      - run: dotnet build src/backend/Modules/Identity/Karry.Modules.Identity.Tests -c Release --no-restore
      - name: Endpoint declarations and masking suite (TC-P1-IAM-005)
        run: dotnet test --project tests/Karry.AuthorizationTests -c Release --no-build
      - name: Scope and role-matrix tests (TC-P1-IAM-006)
        run: >-
          dotnet test --project src/backend/Modules/Identity/Karry.Modules.Identity.Tests -c Release --no-build
          -- --filter-class Karry.Modules.Identity.Tests.Api.AuthorizationTests

  openapi-diff:
    # Breaking changes to the published API contract fail the PR (api-standards: additive changes only within v1).
    name: openapi-diff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: tools/ci/install-tool.sh oasdiff
      - name: No breaking change against the base branch
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          CONTRACT: src/backend/Karry.Host/openapi/v1.json
        run: |
          base="${GITHUB_EVENT_NAME}"
          if [[ "$base" == "pull_request" ]]; then ref="origin/${BASE_REF}"; else ref="HEAD~1"; fi
          if ! git show "${ref}:${CONTRACT}" > "${RUNNER_TEMP}/base.json" 2>/dev/null; then
            echo "No contract on ${ref} yet: nothing to compare (first version)."
            exit 0
          fi
          ~/.local/bin/oasdiff changelog "${RUNNER_TEMP}/base.json" "${CONTRACT}" || true
          ~/.local/bin/oasdiff breaking "${RUNNER_TEMP}/base.json" "${CONTRACT}" --fail-on ERR

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      # Also enforces the supply-chain policy in pnpm-workspace.yaml (release age, trust, sources).
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test (TC-P1-PLT-015)
        run: pnpm test
      - name: FR/EN catalogs complete and every key exists (TC-P1-OFF-007)
        run: pnpm --filter @karry/i18n check:catalogs
      - name: API client is generated from the committed contract (src/backend/Karry.Host/openapi/v1.json)
        run: pnpm --filter @karry/api-client check:generated
      - name: Chromium for the accessibility tests
        run: pnpm --filter @karry/ui exec playwright install --with-deps chromium
      - name: Accessibility of every story in every theme (TC-P1-OFF-006, axe-core in Chromium)
        run: pnpm --filter @karry/ui test:a11y
      - name: Storybook
        run: pnpm --filter @karry/ui build-storybook
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook
          path: src/frontend/packages/ui/storybook-static/
      - run: pnpm build
      - name: Field app bundle budget (initial JS <= 250 KB gzipped, llm_guidelines.md §13)
        run: python3 ../../tools/ci/bundle_budget.py apps/field/dist --max-kb 250 --summary "$GITHUB_STEP_SUMMARY"

  local-stack:
    name: local-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore src/backend/Karry.Host --locked-mode
      # The stack images fill the runner disk to > 90 %, where Loki refuses writes ("Ingester is shutting down").
      # Remove preinstalled toolchains this job never uses (Android SDK, GHC, CodeQL bundles: ~10 GB).
      - name: Free disk space for the local stack
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # TC-P1-PLT-004: all services healthy, extensions, roles, Keycloak, Mailpit, Valkey,
      # S3 Object Lock (compliance) and Karry.Host readiness against the stack.
      - name: Local stack smoke test (TC-P1-PLT-004)
        env:
          KARRY_LGTM_COMPONENT_LOGS: "true" # collector and Loki logs, printed on failure
          KEEP_STACK: "1" # the browser tests below use the same stack, migrated and seeded
        run: deploy/docker/smoke-test.sh
      # P1.8: sign-in in a real browser against this stack (TC-P1-IAM-001/002, tokens in memory, lockout).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend
      - name: Browser end-to-end tests (tools/e2e/run.sh)
        env:
          E2E_INSTALL_DEPS: "1"
        run: tools/e2e/run.sh
      - name: Playwright report and app logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            src/frontend/e2e/playwright-report
            src/frontend/e2e/test-results
            /tmp/karry-e2e-*.log
          retention-days: 7

  security:
    # Free, licence-compatible scanners for a private commercial repository (ADR-0021).
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - run: tools/ci/install-tool.sh gitleaks && tools/ci/install-tool.sh trivy
      - name: Secrets in history (gitleaks, TC-P1-PLT-002)
        # Only the history being built (HEAD), not every fetched branch: a secret on another branch must fail
        # that branch's PR, not every PR (seen with the TC-P1-PLT-002 demo).
        run: ~/.local/bin/gitleaks git --redact --no-banner --exit-code 1 --log-opts="HEAD" .
      - name: Vulnerable dependencies and misconfigurations (Trivy)
        run: >-
          ~/.local/bin/trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 --skip-dirs spikes .
      - name: Static analysis (Semgrep CE 1.180.0, pinned by digest)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
          semgrep scan --metrics=off --error
          --config p/csharp --config p/typescript --config p/react --config p/owasp-top-ten
          --config p/dockerfile --config p/python

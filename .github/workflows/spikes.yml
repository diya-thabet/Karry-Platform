name: spikes (phase 0)

on:
  pull_request:
    paths: ["spikes/**", ".github/workflows/spikes.yml"]
  push:
    branches: [main]
    paths: ["spikes/**", ".github/workflows/spikes.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spikes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: rls-pooling + signature-interop (.NET)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      KARRY_SPIKE_PG: Host=localhost;Port=5432;Username=postgres;Password=postgres
    defaults:
      run:
        working-directory: spikes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: spikes/global.json
      - run: dotnet restore Karry.Spikes.slnx --locked-mode
      - run: dotnet build Karry.Spikes.slnx -c Release --no-restore
      - name: Test (TC-P0-RLS-*, TC-P0-SIG-*)
        run: dotnet test --solution Karry.Spikes.slnx -c Release --no-build --report-trx --results-directory ${{ github.workspace }}/spikes/TestResults
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dotnet-test-results
          path: spikes/TestResults/

  pwa:
    name: field-capture-pwa (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    defaults:
      run:
        working-directory: spikes/field-capture-pwa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: spikes/field-capture-pwa/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: spikes/field-capture-pwa/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test (TC-P0-OFF-*, TC-P0-KEY-*)
        run: pnpm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pwa-test-results
          path: spikes/field-capture-pwa/test-results/

  pg-extensions:
    name: extensions on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["timescale/timescaledb-ha:pg17", "timescale/timescaledb-ha:pg18"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check PostGIS, TimescaleDB, pgvector, pgcrypto (WP-P0-13)
        run: spikes/pg-extensions/check-extensions.sh "${{ matrix.image }}"

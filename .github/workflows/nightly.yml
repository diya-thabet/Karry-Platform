name: nightly

# Catches problems that appear without a code change (new CVEs, flaky tests) and runs slow suites.
# Mutation testing (Stryker.NET, llm_guidelines.md §7.2): Trust since P1.6 (score >= 75 % or the job fails); the math
# modules join in P1.12.

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: dotnet restore Karry.slnx --locked-mode
      - name: NuGet advisories (all severities, transitive)
        run: |
          dotnet list Karry.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi
      - name: npm advisories (high and critical)
        working-directory: src/frontend
        run: pnpm audit --audit-level high
      - run: tools/ci/install-tool.sh trivy
      - name: Trivy with a fresh vulnerability database
        run: ~/.local/bin/trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --skip-dirs spikes .

  stability:
    # Full backend suite twice: a test that passes once and fails once is a bug (llm_guidelines.md §7.6).
    name: stability
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Karry.slnx --locked-mode
      - run: dotnet build Karry.slnx -c Release --no-restore
      - name: Run 1
        run: dotnet test --solution Karry.slnx -c Release --no-build
      - name: Run 2
        run: dotnet test --solution Karry.slnx -c Release --no-build

  mutation:
    # Stryker.NET 5 with the Microsoft Testing Platform runner. Trust.Domain (hashing, chain verification, anchors) and
    # Trust.Application (anchoring, verification against anchors); the tests use real PostgreSQL (Docker on the runner).
    # The units engine (P1.12) is pure: only SharedKernel's Units folder is mutated.
    name: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/backend/Modules/Trust/Karry.Modules.Trust.Tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore ../../../../../Karry.slnx --locked-mode
      - run: dotnet tool restore
      - name: Trust.Domain (break below 75 %)
        run: dotnet stryker --config-file stryker-config.json --output "$RUNNER_TEMP/stryker/domain"
      - name: Trust.Application (break below 75 %)
        if: always()
        run: dotnet stryker --config-file stryker-config.application.json --output "$RUNNER_TEMP/stryker/application"
      - name: Units engine in SharedKernel (break below 70 %)
        if: always()
        working-directory: tests/Karry.SharedKernel.UnitTests
        run: dotnet stryker --config-file stryker-config.units.json --output "$RUNNER_TEMP/stryker/units"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-reports
          path: ${{ runner.temp }}/stryker/


  # P1.18a load suite (docs/05-quality/load-testing.md): 500 signed tablets (burst and shift, H-L1), TC-P1-TEN-005
  # (10,000 mixed requests of two companies, 0 leaks, p95 < 300 ms) and a 300-user spike, against the local stack.
  load:
    name: load
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore src/backend/Karry.Host --locked-mode
      - name: Free disk space for the local stack
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: Local stack, migrated and seeded
        env:
          KEEP_STACK: "1"
        run: deploy/docker/smoke-test.sh
      - name: Karry.Host with the load-run limits (tests/load/run.sh)
        run: |
          dotnet build src/backend/Karry.Host -c Release
          cd src/backend/Karry.Host/bin/Release/net10.0
          DOTNET_ENVIRONMENT=Development ASPNETCORE_ENVIRONMENT=Development \
            RateLimits__PerPersonPerMinute=100000 RateLimits__AnonymousPerAddressPerMinute=100000 \
            nohup dotnet Karry.Host.dll --urls http://127.0.0.1:5000 > /tmp/karry-load-host.log 2>&1 &
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:5000/health/ready && exit 0; sleep 2; done
          cat /tmp/karry-load-host.log; exit 1
      - run: tools/ci/install-tool.sh k6
      - name: Load suite
        run: tests/load/run.sh
      - name: Load results and host log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-results
          path: |
            tests/load/results
            /tmp/karry-load-host.log
          retention-days: 14

  # P1.18a OWASP ZAP baseline (hardening plan H-W1, tests/security/zap.sh): passive scan of the portal and field app
  # (production builds under their page policy) and of the API from its OpenAPI description. Fails on a high finding
  # or a medium one not accepted in tests/security/zap-accepted.tsv.
  zap:
    name: zap
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore src/backend/Karry.Host --locked-mode
      - name: Free disk space for the local stack
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: Local stack, migrated and seeded
        env:
          KEEP_STACK: "1"
        run: deploy/docker/smoke-test.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend
      - name: ZAP baseline (apps and API started by tools/e2e/run.sh)
        run: tools/e2e/run.sh tests/security/zap.sh tests/security/results
      - name: Findings on the run page
        if: always()
        run: cat tests/security/results/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: ZAP reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-reports
          path: tests/security/results
          retention-days: 14

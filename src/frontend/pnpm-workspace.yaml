# Frontend workspace (ADR-0020). Versions are declared once in the catalog and referenced as "catalog:".
packages:
  - apps/*
  - packages/*
  - e2e

# Supply-chain protections (flagged by Semgrep; llm_guidelines.md §10.2, §18).
# Do not install versions published less than 7 days ago (most malicious releases are pulled within days).
minimumReleaseAge: 10080
# Refuse an update that downgrades a package's provenance/trust evidence.
trustPolicy: no-downgrade
# Reviewed exceptions (package published before npm provenance existed, not a takeover). Keep this list short.
trustPolicyExclude:
  # semver 6.x line (maintained by the npm team), 6.3.1 is the CVE-2022-25883 fix; pulled in by @babel/core.
  - semver@6.3.1
  # rollup 2.x backport with the path traversal fix, needed by workbox-build 7.4.0 (see overrides). Published by the
  # Rollup lead maintainer (same npm account as 2.79.2), tagged v2.80.0 in rollup/rollup; only 4.x has provenance.
  - rollup@2.80.0
# Transitive dependencies may only come from the registry (no git/tarball URLs).
blockExoticSubdeps: true

catalog:
  react: 19.3.1
  react-dom: 19.3.1
  maplibre-gl: 6.15.0
  "@types/geojson": 7946.0.16
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/node": 24.19.2
  typescript: 6.0.3
  vite: 8.3.4
  "@vitejs/plugin-react": 6.1.2
  vitest: 5.0.5
  jsdom: 30.1.3
  "@testing-library/react": 16.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/jest-dom": 7.0.1
  eslint: 10.12.0
  "@eslint/js": 10.0.1
  typescript-eslint: 8.71.2
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  globals: 17.13.0
  # Feature flags (P1.10, ADR-0019): OpenFeature web SDK; newest versions published >= 7 days before 2026-10-25
  "@openfeature/core": 1.12.0
  "@openfeature/web-sdk": 1.10.0
  "@openfeature/react-sdk": 1.4.1
  # i18n (P1.7): newest versions published >= 7 days before 2026-10-23
  i18next: 26.4.7
  react-i18next: 17.0.20
  i18next-icu: 2.5.0
  intl-messageformat: 12.1.3
  # Field app and tablet enrollment QR (P1.15, ADR-0028): newest versions published >= 7 days before 2026-10-28
  dexie: 4.4.7
  uqr: 0.1.3
  fake-indexeddb: 6.2.6
  vite-plugin-pwa: 2.0.0
  workbox-window: 7.4.0
  # Design system (P1.7): newest versions published >= 7 days before 2026-10-23
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@radix-ui/react-dialog": 1.3.1
  "@radix-ui/react-dropdown-menu": 2.2.1
  "@radix-ui/react-select": 2.4.1
  "@radix-ui/react-toast": 1.3.1
  "@radix-ui/react-slot": 1.5.0
  # Writing direction for Arabic and N'Ko (2026-10-29): already in the lockfile through the Radix components
  "@radix-ui/react-direction": 1.2.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  lucide-react: 1.58.0
  "@fontsource-variable/inter": 5.3.0
  # Arabic and N'Ko scripts (2026-10-29): published 2026-07-19
  "@fontsource-variable/noto-sans-arabic": 5.3.0
  "@fontsource/noto-sans-nko": 5.3.0
  storybook: 10.6.2
  "@storybook/react-vite": 10.6.2
  "@storybook/addon-a11y": 10.6.2
  "@vitest/browser": 5.0.5
  "@vitest/browser-playwright": 5.0.5
  playwright: 1.64.1
  axe-core: 4.14.0
  # App shells and error tracking (P1.7)
  "@tanstack/react-router": 1.170.45
  "@tanstack/react-query": 5.104.3
  "@sentry/react": 11.8.0
  # Typed API client (P1.7)
  openapi-typescript: 7.13.0
  openapi-fetch: 0.17.0
  # Sign-in (P1.8): newest versions published >= 7 days before 2026-10-24
  oidc-client-ts: 3.5.0
  "@playwright/test": 1.64.1

# Dependency install scripts are blocked by default (pnpm 12). Each decision is explicit and reviewed:
allowBuilds:
  # The binary comes from the platform package @esbuild/<os>-<arch>; the postinstall only re-checks it.
  esbuild: false

# Reviewed version pins: vite-plugin-pwa 2.0.0 asks for workbox ^7.4.1, whose only change is moving
# rollup-plugin-off-main-thread to a single-maintainer fork that the trust policy flags as a possible takeover.
# 7.4.0 keeps the original package (Surma, Google); same build output for our use (precache manifest).
# Its build chain is then patched for two high advisories (build time only, never shipped to the browser):
# rollup 2 path traversal (GHSA fixed in 2.80.0) and serialize-javascript RCE (fixed in 7.0.3).
overrides:
  workbox-build: 7.4.0
  workbox-window: 7.4.0
  rollup@2: 2.80.0
  serialize-javascript: 7.1.2

# Reviewed peer-dependency exceptions:
peerDependencyRules:
  allowedVersions:
    # openapi-typescript 7.13 (newest stable) declares typescript ^5; its output is type-checked under our TS 6 in CI.
    openapi-typescript>typescript: "6"

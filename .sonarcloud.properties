# SonarCloud automatic analysis settings (read from the repository root).
#
# Product code and test code are told apart: test projects, the end-to-end, load and security suites and the frontend
# *.test.ts(x) files are analysed as tests, so rules written for shipped code (hard-coded credentials, http URLs,
# fixed IP addresses, timeouts on test-only processes) do not fire on throwaway containers and fixtures.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.Tests/**,tests/**,**/*.test.ts,**/*.test.tsx,src/frontend/e2e/**,src/frontend/packages/auth/src/testing.ts
#
# Not analysed at all:
# - spikes/: archived experiments kept as the evidence behind ADRs, never built into the product.
# - tests/load/lib/crypto.gen.js: an esbuild bundle of @karry/crypto for k6 (the source is analysed in packages/crypto).
# - the test files above, from the product side (a file is either product code or test code).
sonar.exclusions=spikes/**,**/*.Tests/**,tests/**,**/*.test.ts,**/*.test.tsx,src/frontend/e2e/**,src/frontend/packages/auth/src/testing.ts
sonar.test.exclusions=spikes/**,tests/load/lib/crypto.gen.js
#
# Duplication (CPD) is measured on hand-written product code only:
# - EF Core migrations and their snapshots are generated, and every module's first migration creates the same outbox tables.
# - The API client's schema.ts is generated from openapi/v1.json.
# - Test projects repeat the same host and HTTP plumbing per module on purpose: each module's tests stand alone.
sonar.cpd.exclusions=**/Migrations/**,src/frontend/packages/api-client/src/schema.ts,**/*.Tests/**,tests/**,**/*.test.ts,**/*.test.tsx

# Unit tests of karry-alerts.yaml (TC-P1-OPS-006): each alert fires on the condition of US-P1-OPS-02 AC1, only after
# its duration, and stays quiet just below the threshold or on traffic it must ignore.
# Run: promtool test rules deploy/observability/alerts/karry-alerts.test.yaml
rule_files:
  - karry-alerts.yaml

evaluation_interval: 1m

tests:
  # --- Error rate > 2 % for 5 min ---------------------------------------------------------------------------
  - name: error rate of 4.8 % fires after 5 minutes, not before
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="karry-api", http_route="/api/v1/assets", http_response_status_code="200"}'
        values: '0+60x20'
      - series: 'http_server_request_duration_seconds_count{job="karry-api", http_route="/api/v1/assets", http_response_status_code="500"}'
        values: '0+3x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: KarryApiErrorRateHigh
        exp_alerts: []
      - eval_time: 10m
        alertname: KarryApiErrorRateHigh
        exp_alerts:
          - exp_labels: {job: karry-api, severity: page}
            exp_annotations:
              summary: "karry-api error rate 4.762% (> 2 % for 5 min)"
              description: "More than 2 % of API requests return 5xx. Check the 'Karry · API (RED per module)' dashboard for the module."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-api-error-rate-high.md"

  - name: error rate of 1.6 % stays quiet
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="karry-api", http_route="/api/v1/assets", http_response_status_code="200"}'
        values: '0+60x20'
      - series: 'http_server_request_duration_seconds_count{job="karry-api", http_route="/api/v1/assets", http_response_status_code="500"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: KarryApiErrorRateHigh
        exp_alerts: []

  - name: failing health probes are not API errors
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="karry-api", http_route="/health/ready", http_response_status_code="503"}'
        values: '0+12x20'
      - series: 'http_server_request_duration_seconds_count{job="karry-api", http_route="/api/v1/assets", http_response_status_code="200"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: KarryApiErrorRateHigh
        exp_alerts: []

  - name: one failure at night (low traffic) does not page
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="karry-api", http_route="/api/v1/assets", http_response_status_code="200"}'
        values: '0+2x20'
      - series: 'http_server_request_duration_seconds_count{job="karry-api", http_route="/api/v1/assets", http_response_status_code="500"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: KarryApiErrorRateHigh
        exp_alerts: []

  # --- p95 > 1 s for 10 min --------------------------------------------------------------------------------
  - name: p95 above 1 s fires after 10 minutes, not before
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_bucket{job="karry-api", http_route="/api/v1/reports", le="0.5"}'
        values: '0+6x30'
      - series: 'http_server_request_duration_seconds_bucket{job="karry-api", http_route="/api/v1/reports", le="1"}'
        values: '0+6x30'
      - series: 'http_server_request_duration_seconds_bucket{job="karry-api", http_route="/api/v1/reports", le="2.5"}'
        values: '0+60x30'
      - series: 'http_server_request_duration_seconds_bucket{job="karry-api", http_route="/api/v1/reports", le="+Inf"}'
        values: '0+60x30'
      - series: 'http_server_request_duration_seconds_count{job="karry-api", http_route="/api/v1/reports", http_response_status_code="200"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: KarryApiLatencyP95High
        exp_alerts: []
      - eval_time: 25m
        alertname: KarryApiLatencyP95High
        exp_alerts:
          - exp_labels: {job: karry-api, severity: page}
            exp_annotations:
              summary: "karry-api p95 latency 2.417s (> 1 s for 10 min)"
              description: "Requests are slow. Check the p95-by-route panel and DB command duration on the dashboards."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-api-latency-p95-high.md"

  - name: fast requests and slow health probes stay quiet
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_bucket{job="karry-api", http_route="/api/v1/assets", le="0.5"}'
        values: '0+60x30'
      - series: 'http_server_request_duration_seconds_bucket{job="karry-api", http_route="/api/v1/assets", le="+Inf"}'
        values: '0+60x30'
      - series: 'http_server_request_duration_seconds_bucket{job="karry-api", http_route="/health/ready", le="0.5"}'
        values: '0+0x30'
      - series: 'http_server_request_duration_seconds_bucket{job="karry-api", http_route="/health/ready", le="+Inf"}'
        values: '0+60x30'
      - series: 'http_server_request_duration_seconds_count{job="karry-api", http_route="/api/v1/assets", http_response_status_code="200"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: KarryApiLatencyP95High
        exp_alerts: []

  # --- Outbox lag > 5 min -----------------------------------------------------------------------------------
  - name: outbox lag above 5 minutes fires for that module only
    interval: 1m
    input_series:
      - series: 'karry_outbox_oldest_pending_age_seconds{job="karry-workers", module="assets"}'
        values: '0+60x12'
      - series: 'karry_outbox_oldest_pending_age_seconds{job="karry-workers", module="fleet"}'
        values: '30x12'
    alert_rule_test:
      - eval_time: 7m
        alertname: KarryOutboxLagHigh
        exp_alerts: []
      - eval_time: 9m
        alertname: KarryOutboxLagHigh
        exp_alerts:
          - exp_labels: {job: karry-workers, module: assets, severity: page}
            exp_annotations:
              summary: "Outbox of module assets lags 9m 0s (> 5 min)"
              description: "Domain events are not reaching subscribers. Check the worker logs and the 'Outbox messages by outcome' panel."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-outbox-lag-high.md"

  # --- Ledger anchoring stale > 2 h -------------------------------------------------------------------------
  - name: anchoring that last succeeded 2 h 10 min ago fires; a recent success stays quiet
    interval: 1m
    input_series:
      # Last full success at t=0 (value 0 = unix time 0, the test clock's origin); the worker keeps reporting it.
      - series: 'karry_ledger_anchor_last_success_seconds{job="karry-workers"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 125m
        alertname: KarryLedgerAnchoringStale
        exp_alerts: []
      - eval_time: 135m
        alertname: KarryLedgerAnchoringStale
        exp_alerts:
          - exp_labels: {job: karry-workers, severity: page}
            exp_annotations:
              summary: "Ledger anchoring has not fully succeeded for over 2 hours"
              description: "Chain heads are not reaching WORM storage: tampering since the last anchor would be harder to prove. Check the worker logs (event 4001)."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-ledger-anchoring-stale.md"

  - name: hourly successful anchoring stays quiet
    interval: 1m
    input_series:
      # Each hour the last-success time moves forward by 3600 s.
      - series: 'karry_ledger_anchor_last_success_seconds{job="karry-workers"}'
        values: '0x59 3600x59 7200x59 10800x59'
    alert_rule_test:
      - eval_time: 230m
        alertname: KarryLedgerAnchoringStale
        exp_alerts: []

  - name: a worker that never reports anchoring fires after the grace period
    interval: 1m
    input_series:
      - series: 'up{job="karry-workers"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: KarryLedgerAnchoringStale
        exp_alerts: []
      - eval_time: 15m
        alertname: KarryLedgerAnchoringStale
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "Ledger anchoring has not fully succeeded for over 2 hours"
              description: "Chain heads are not reaching WORM storage: tampering since the last anchor would be harder to prove. Check the worker logs (event 4001)."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-ledger-anchoring-stale.md"

  # --- Database CPU > 80 % for 15 min -----------------------------------------------------------------------
  - name: database CPU at 90 % fires after 15 minutes; 70 % and other hosts stay quiet
    interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{karry_role="database", instance="db-1", cpu="0", mode="idle"}'
        values: '0+6x40'
      - series: 'node_cpu_seconds_total{karry_role="database", instance="db-2", cpu="0", mode="idle"}'
        values: '0+18x40'
      - series: 'node_cpu_seconds_total{karry_role="app", instance="app-1", cpu="0", mode="idle"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: KarryDatabaseCpuHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: KarryDatabaseCpuHigh
        exp_alerts:
          - exp_labels: {instance: db-1, severity: page}
            exp_annotations:
              summary: "Database db-1 CPU 90 % (> 80 % for 15 min)"
              description: "PostgreSQL is CPU-bound. Look for expensive queries (pg_stat_statements) before scaling."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-database-cpu-high.md"

  # --- Certificate expiry < 14 days -------------------------------------------------------------------------
  - name: certificate expiring in 10 days fires after 1 hour; 30 days stays quiet
    interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox-https", instance="https://app.karry.example"}'
        values: '864000x80'
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox-https", instance="https://api.karry.example"}'
        values: '2592000x80'
    alert_rule_test:
      - eval_time: 50m
        alertname: KarryCertificateExpiringSoon
        exp_alerts: []
      - eval_time: 70m
        alertname: KarryCertificateExpiringSoon
        exp_alerts:
          - exp_labels: {job: blackbox-https, instance: "https://app.karry.example", severity: ticket}
            exp_annotations:
              summary: "Certificate of https://app.karry.example expires in 10.0 days"
              description: "Automatic renewal did not happen. Renew before expiry or every client (portal, field app, edge agents) fails TLS."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-certificate-expiring-soon.md"

  # --- Tenant over its plan limit -----------------------------------------------------------------------------
  - name: a tenant over its limit for an hour opens a ticket; none over stays quiet
    interval: 1m
    input_series:
      - series: 'karry_billing_usage_over_limit{job="karry-workers"}'
        values: '0x30 2x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: KarryTenantOverLimit
        exp_alerts: []
      - eval_time: 80m
        alertname: KarryTenantOverLimit
        exp_alerts: []
      - eval_time: 95m
        alertname: KarryTenantOverLimit
        exp_alerts:
          - exp_labels: {job: karry-workers, severity: ticket}
            exp_annotations:
              summary: "2 tenant limit(s) exceeded at the last usage snapshot"
              description: "A company uses more than its plan allows. Contact it about an upgrade; creation stops at the limit + 10 %. Worker logs: event 5002."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-tenant-over-limit.md"

  # --- Usage snapshot stale > 26 h ----------------------------------------------------------------------------
  - name: a snapshot 27 h old opens a ticket; a recent one stays quiet
    interval: 1m
    input_series:
      # Last full snapshot at t=0; the worker keeps reporting it.
      - series: 'karry_billing_usage_last_success_seconds{job="karry-workers"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 25h
        alertname: KarryUsageSnapshotStale
        exp_alerts: []
      - eval_time: 27h
        alertname: KarryUsageSnapshotStale
        exp_alerts:
          - exp_labels: {job: karry-workers, severity: ticket}
            exp_annotations:
              summary: "No complete usage snapshot for over 26 hours"
              description: "The daily usage snapshot failed for a tenant or did not run. Check the worker logs (event 5003)."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-usage-snapshot-stale.md"


  # --- Shift generation stale > 26 h ---------------------------------------------------------------------------
  - name: a shift generation 27 h old opens a ticket; a recent one stays quiet
    interval: 1m
    input_series:
      # Last full generation at t=0; the worker keeps reporting it.
      - series: 'karry_organization_shifts_last_success_seconds{job="karry-workers"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 25h
        alertname: KarryShiftInstancesStale
        exp_alerts: []
      - eval_time: 27h
        alertname: KarryShiftInstancesStale
        exp_alerts:
          - exp_labels: {job: karry-workers, severity: ticket}
            exp_annotations:
              summary: "No complete shift generation for over 26 hours"
              description: "The daily shift generator failed for a tenant or did not run. Check the worker logs (event 7001)."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-shift-instances-stale.md"

  # --- Sync gap open > 24 h (ADR-0031 §4) ---------------------------------------------------------------------
  - name: a sequence gap over 24 h opens a ticket after 15 minutes; a closed gap clears it
    interval: 1m
    input_series:
      # The oldest waiting command passes 24 h at about 7 minutes; the gap is closed at 40 minutes.
      - series: 'karry_sync_oldest_waiting_age_seconds{job="karry-workers"}'
        values: '86000+60x40 0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: KarrySyncGapOpen
        exp_alerts: []
      - eval_time: 30m
        alertname: KarrySyncGapOpen
        exp_alerts:
          - exp_labels: {job: karry-workers, severity: ticket}
            exp_annotations:
              summary: "A tablet has had a sequence gap for over 24 hours"
              description: "Commands of a tablet wait for an earlier number that has not come: data may be lost on that tablet. The worker logs name it (event 7206)."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-sync-gap.md"
      - eval_time: 50m
        alertname: KarrySyncGapOpen
        exp_alerts: []

  # --- Evidence store (ADR-0032) --------------------------------------------------------------------------------
  - name: evidence checks failing for 15 minutes open a ticket, a short outage does not
    interval: 1m
    input_series:
      - series: 'karry_sync_blobs_total{job="karry-api",result="unavailable"}'
        values: '0+1x10 10x20 10+1x40 50x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: KarryEvidenceStoreUnavailable
        exp_alerts: []
      - eval_time: 55m
        alertname: KarryEvidenceStoreUnavailable
        exp_alerts:
          - exp_labels: {job: karry-api, severity: ticket}
            exp_annotations:
              summary: "The evidence store has not answered for 15 minutes"
              description: "Commands with photos are refused for now (sync.blobs_unavailable) and wait on the tablets. Check the object store and the API's Storage:Evidence settings."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-evidence-upload.md"
      - eval_time: 85m
        alertname: KarryEvidenceStoreUnavailable
        exp_alerts: []

  - name: the first evidence mismatch after a start pages at once, verified blobs do not
    interval: 1m
    input_series:
      - series: 'karry_sync_blobs_total{job="karry-api",result="verified"}'
        values: '0+5x60'
      - series: 'karry_sync_blobs_total{job="karry-api",result="mismatch"}'
        values: '_x10 1x50'
    alert_rule_test:
      - eval_time: 9m
        alertname: KarrySyncBlobMismatch
        exp_alerts: []
      - eval_time: 11m
        alertname: KarrySyncBlobMismatch
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "A tablet's evidence does not match its signed entry"
              description: "The photo in the store is not the one the tablet signed; the entry was refused (sync.blob_mismatch). The API logs name the tablet and the command (event 7208)."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-evidence-upload.md"
      - eval_time: 35m
        alertname: KarrySyncBlobMismatch
        exp_alerts: []

  # --- Break-glass support session (ADR-0029 §4) -------------------------------------------------------------
  - name: the first break-glass session after a start (new series at 1) fires at once
    interval: 1m
    input_series:
      - series: 'karry_support_break_glass_sessions_total{job="karry-api"}'
        values: '_x10 1x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: KarryBreakGlassSupport
        exp_alerts: []
      - eval_time: 11m
        alertname: KarryBreakGlassSupport
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "A break-glass support session was opened"
              description: "A Karry operator is reading a company's data without its code. Check the API logs (event 2200) and the company's audit log."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-break-glass-support.md"
      - eval_time: 35m
        alertname: KarryBreakGlassSupport
        exp_alerts: []

  - name: another break-glass session on a running API fires
    interval: 1m
    input_series:
      - series: 'karry_support_break_glass_sessions_total{job="karry-api"}'
        values: '1x30 2x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: KarryBreakGlassSupport
        exp_alerts: []
      - eval_time: 32m
        alertname: KarryBreakGlassSupport
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "A break-glass support session was opened"
              description: "A Karry operator is reading a company's data without its code. Check the API logs (event 2200) and the company's audit log."
              runbook_url: "https://github.com/diya-thabet/Karry-Platform/blob/main/docs/06-operations/runbooks/karry-break-glass-support.md"


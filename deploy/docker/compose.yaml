# Karry local stack (US-P1-PLT-02, ADR-0017). Start: docker compose -f deploy/docker/compose.yaml up -d --wait
# Every port is bound to 127.0.0.1 only. Credentials are for local development and never used elsewhere.
name: karry

services:
  postgres:
    # PostgreSQL 17 with PostGIS, TimescaleDB, pgvector, pgcrypto (verified in Phase 0, WP-P0-13).
    image: timescale/timescaledb-ha:pg17.11-ts2.31.0
    environment:
      POSTGRES_PASSWORD: ${KARRY_PG_SUPERUSER_PASSWORD:-karry-local-only}
      POSTGRES_DB: karry
      KARRY_OWNER_PASSWORD: ${KARRY_OWNER_PASSWORD:-karry-owner-local-only}
      KARRY_APP_PASSWORD: ${KARRY_APP_PASSWORD:-karry-local-only}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../database:/karry/database:ro
    healthcheck:
      # TCP, not the socket: the init phase runs a socket-only temporary server (Phase 0 finding).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d karry"]
      interval: 3s
      timeout: 3s
      retries: 60

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local-only}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local-only}
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:9000:9000"]
    volumes:
      # Realm and login theme as code (P1.8, ADR-0012): the realm is imported on first start, themes are read live.
      - ../keycloak/realm:/opt/keycloak/data/import:ro
      - ../keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl: talk HTTP over bash's /dev/tcp to the management port.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  s3:
    # S3-compatible store with Object Lock for photos, documents and WORM ledger anchors (ADR-0017).
    image: chrislusf/seaweedfs:4.48
    # Small volumes: the default (30 GB each, count derived from free disk) leaves no writable volume on
    # laptops and CI runners ("No writable volumes and no free volumes left"). Each bucket is a collection.
    command:
      - server
      - -dir=/data
      - -master.volumeSizeLimitMB=256
      - -volume.max=64
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 60

  valkey:
    image: valkey/valkey:9.0.6-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    # Catches every e-mail sent locally (invitations, alerts). UI: http://localhost:8025
    image: axllent/mailpit:v1.31.6
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 30

  lgtm:
    # Local observability (US-P1-OPS-01/02): OpenTelemetry collector, Prometheus (with Karry's alert rules), Tempo,
    # Loki and Grafana in one container. Grafana: http://localhost:3000 (anonymous admin, local only).
    # Karry hosts send OTLP to 127.0.0.1:4317 (appsettings.Development.json).
    image: grafana/otel-lgtm:0.37.0
    environment:
      # No plugin downloads and no phoning home: the stack starts offline and reproducibly.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Component logs (collector, Loki) are off by default; CI turns them on to diagnose failures.
      ENABLE_LOGS_OTELCOL: ${KARRY_LGTM_COMPONENT_LOGS:-false}
      ENABLE_LOGS_LOKI: ${KARRY_LGTM_COMPONENT_LOGS:-false}
    ports: ["127.0.0.1:3000:3000", "127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    volumes:
      - ../observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ../observability/alerts:/etc/karry/alerts:ro
      - ../observability/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/karry.yaml:ro
      - ../observability/dashboards:/otel-lgtm/karry-dashboards:ro
    healthcheck:
      # The image writes /tmp/ready once every component answers.
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

volumes:
  pgdata:
  s3data:
